version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: password-manager:latest
    container_name: password-manager
    ports:
      - "8000:8000"
    volumes:
      # Private key & auth config (read-only; never baked into the image)
      - ${HOME}/.env:/root/.env:ro
      - ${HOME}/.config/saving-passwords:/root/.config/saving-passwords:ro
    restart: unless-stopped

